# Prometheus configuration for starbunk-rs metrics.
# Receives metrics via remote_write from the OTEL collector.
# Also scrapes the collector's own metrics endpoint.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: starbunk-rs
    environment: production

# Remote write receiver is enabled via the --web.enable-remote-write-receiver
# flag in the docker-compose command override.

scrape_configs:
  # Prometheus self-monitoring.
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # OTEL collector internal metrics (pipeline throughput, drop rates, etc.).
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]

  # BunkBot subbot metrics (Prometheus client library on /metrics endpoint).
  - job_name: bunkbot
    scrape_interval: 10s
    static_configs:
      - targets: [bunkbot:9082]
    metrics_path: /metrics
