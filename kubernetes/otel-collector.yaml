apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-conf
  namespace: starbunk
data:
  otel-collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    exporters:
      googlecloud:
        project: starbunk-bot
      otlphttp/langfuse:
        endpoint: "https://cloud.langfuse.com/api/public/otel"
        headers:
          Authorization: "Basic ${env:LANGFUSE_AUTH_STRING}"
          x-langfuse-ingestion-version: "4"
        log:
          default_log_name: "opentelemetry.app"

    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [googlecloud, otlphttp/langfuse]
        logs:
          receivers: [otlp]
          exporters: [googlecloud]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: starbunk
spec:
  ports:
    - name: grpc
      port: 4317
    - name: http
      port: 4318
  selector:
    app: otel-collector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: starbunk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.154.0
          args: ["--config=/etc/otel/otel-collector.yaml"]
          env:
            - name: LANGFUSE_AUTH_STRING
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: auth-string
          volumeMounts:
            - name: config
              mountPath: /etc/otel
          ports:
            - containerPort: 4317
            - containerPort: 4318
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: otel-collector-conf
