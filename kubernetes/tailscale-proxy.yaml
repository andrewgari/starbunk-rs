# NOTE — one-time migration step.
#
# This file previously also defined a standalone `starbunk-ui-tailscale`
# Deployment. That proxy has been folded into the `starbunk-ui` pod as a
# sidecar (see kubernetes/starbunk-ui.yaml). `kubectl apply` does not prune
# removed objects, and the old pod keeps `tailscale-proxy-pvc` (ReadWriteOnce)
# mounted, which conflicts with the new sidecar. Delete it once before rolling
# out the updated starbunk-ui:
#
#   kubectl -n starbunk delete deployment starbunk-ui-tailscale --ignore-not-found
#
# The ConfigMap and PVC below are still used by the sidecar.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tailscale-serve-config
  namespace: starbunk
data:
  serve-config.json: |
    {
      "TCP": {
        "443": {
          "HTTPS": true
        },
        "80": {
          "HTTPS": false
        }
      },
      "Web": {
        "${TS_CERT_DOMAIN}:443": {
          "Handlers": {
            "/": {
              "Proxy": "http://127.0.0.1:3000"
            }
          }
        },
        "${TS_CERT_DOMAIN}:80": {
          "Handlers": {
            "/": {
              "Proxy": "http://127.0.0.1:3000"
            }
          }
        }
      },
      "AllowFunnel": {
        "${TS_CERT_DOMAIN}:443": false,
        "${TS_CERT_DOMAIN}:80": false
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tailscale-proxy-pvc
  namespace: starbunk
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
