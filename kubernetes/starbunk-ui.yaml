---
# ServiceAccount for the UI pod — gives it an identity to bind RBAC to.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: starbunk-ui
  namespace: starbunk

---
# Role — least-privilege: read/patch Deployments and ConfigMaps in this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: starbunk-ui
  namespace: starbunk
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: starbunk-ui
  namespace: starbunk
subjects:
  - kind: ServiceAccount
    name: starbunk-ui
    namespace: starbunk
roleRef:
  kind: Role
  name: starbunk-ui
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: starbunk-ui
  namespace: starbunk
  labels:
    app: starbunk-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: starbunk-ui
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: starbunk-ui
    spec:
      serviceAccountName: starbunk-ui
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      containers:
        - name: starbunk-ui
          image: us-central1-docker.pkg.dev/starbunk-bot/starbunk-repo/starbunk-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: K8S_NAMESPACE
              value: "starbunk"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: starbunk-secrets
                  key: DATABASE_URL
                  optional: true
            - name: BUNKBOT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: starbunk-secrets
                  key: BUNKBOT_ADMIN_TOKEN
                  optional: true
            # Bot API URLs — within-cluster DNS (service names match bot names)
            - name: BUNKBOT_API_URL
              value: "http://bunkbot:9082"
            - name: COVABOT_API_URL
              value: "http://covabot:9083"
            - name: DJCOVA_API_URL
              value: "http://djcova:9084"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
        - name: tailscale
          image: tailscale/tailscale:v1.98.4
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: TS_AUTHKEY
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_USERSPACE
              value: "true"
            - name: TS_HOSTNAME
              value: "starbunk-ui"
            - name: TS_SERVE_CONFIG
              value: "/config/serve-config.json"
            - name: TS_EXTRA_ARGS
              value: "--advertise-tags=tag:k8s-operator"
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_STATE_DIR
              value: "/var/lib/tailscale"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: serve-config
              mountPath: /config
            - name: ts-state
              mountPath: /var/lib/tailscale
      volumes:
        - name: serve-config
          configMap:
            name: tailscale-serve-config
        - name: ts-state
          persistentVolumeClaim:
            claimName: tailscale-proxy-pvc

---
# Service — ClusterIP only. Tailscale sidecar handles external access via tailnet.
apiVersion: v1
kind: Service
metadata:
  name: starbunk-ui
  namespace: starbunk
spec:
  selector:
    app: starbunk-ui
  ports:
    - port: 80
      targetPort: 3000
